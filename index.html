<!DOCTYPE html>
<html lang="en">
<head>
    <form>
  <label for="nombre"> Nombre:</label><br>
  <input type="text" id="nombre" name="nombre"><br>
  <label for="apellido"> Apellido:</label><br>
  <input type="text" id="apellido" name="apellido"><br><br>

<label for="nacimiento">Fecha de nacimiento:</label>
  <input type="date" id="nacimiento" name="nacimiento"><br><br>
  
<label for="provincia">Provincia:</label>
  <input type="text" id="provincia" name="provincia" placeholder="ej: Pichincha"><br><br>
  
<label for="frecuencia" >¿Con qué frecuencia visitas sitios turísticos?</label><br>
<input type="radio" name="frecuencia" value="primera"> Es mi primera vez<br>
<input type="radio" name="frecuencia" value="ocasional"> Ocasionalmente<br>
<input type="radio" name="frecuencia" value="regular"> Regularmente<br>
<input type="radio" name="frecuencia" value="frecuente"> Muy frecuentemente<br><br>
  
<label for="frecuencia" >¿Qué sitio turístico te interesa visitar?</label><br>  
<input type="radio" name="sitio" value="primera"> Volcán Cotopaxi<br>
<input type="radio" name="sitio" value="ocasional"> Parque Nacional Yasuní<br>
<input type="radio" name="sitio" value="regular"> Parque Nacional Cajas<br>
<input type="radio" name="sitio" value="frecuente"> Parque Nacional Galápagos<br><br>

<label for ="actividades">¿Qué actividades te gustaría realizar? (Puedes elegir varias)</label><br> 
<label><input type="checkbox" name="actividades" value="senderismo"> Senderismo / Caminata hacia el refugio</label><br>
<label><input type="checkbox" name="actividades" value="cumbre"> Ascenso a la cumbre (alpinismo)</label><br>
<label><input type="checkbox" name="actividades" value="laguna"> Recorrido o picnic alrededor de la Laguna de Limpiopungo</label><br>
<label><input type="checkbox" name="actividades" value="ciclismo"> Ciclismo de montaña (MTB)</label><br>
<label><input type="checkbox" name="actividades" value="cabalgatas"> Cabalgatas / Paseos a caballo</label><br>
<label><input type="checkbox" name="actividades" value="fotografia"> Fotografía / Avistamiento de fauna y flora</label><br><br 

<label for="personas" >¿Con quién prefieres viajar?</label><br>
<input type="radio" name="personas" value="solo"> Solo / Sola<br>
<input type="radio" name="personas" value="pareja"> En pareja<br>
<input type="radio" name="personas" value="familia"> Con familia (incluye niños)<br>
<input type="radio" name="personas" value="amigos"> Con grupo de amigos<br>
<input type="radio" name="personas" value="tour"> Tour organizado / Agencia de viajes<br><br>

<label for="lo_que_mas_gusto"><strong>¿Qué fue lo que MÁS te gustó de tu visita?</strong></label><br>
    <textarea id="lo_que_mas_gusto" name="lo_que_mas_gusto" rows="4" cols="50" placeholder="Escribe tu respuesta aquí..."></textarea>
    <br><br>

    <label for="sugerencias"><strong>¿Tienes sugerencias, comentarios o aspectos a mejorar para la administración del sitio?</strong></label><br>
    <textarea id="sugerencias" name="sugerencias" rows="4" cols="50" placeholder="Escribe tus sugerencias aquí..."></textarea>
    <br><br>
  
   <input type="submit" value="Enviar">
</form>


</head>
<body>
    
</body>
</html>
